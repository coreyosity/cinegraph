name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      # Reuse the same gate as local dev, pointing the Makefile at the runner's tools
      # (which live on PATH here, not in a .venv).
      - name: Lint, type-check, and test
        run: make check PY=python RUFF=ruff MYPY=mypy
